@if (mensagem) {
  <p>{{ mensagem }}</p>
}

<form [formGroup]="usuarioForm" (ngSubmit)="cadastrarUsuario()">
  <div>
    <label for="username">Username:</label>
    <input id="username" type="text" formControlName="username" />
  </div>

  <div>
    <label for="nome">Nome:</label>
    <input id="nome" type="text" formControlName="nome" />
  </div>

  <div>
    <label for="cpf">CPF:</label>
    <input id="cpf" type="text" formControlName="cpf" />
  </div>

  <div>
    <label for="email">Email:</label>
    <input id="email" type="email" formControlName="email" />
  </div>

  <div>
    <label for="password">Senha:</label>
    <input id="password" type="password" formControlName="password" />
  </div>

  <div>
    <label for="isAdmin">Administrador:</label>
    <input id="isAdmin" type="checkbox" formControlName="isAdmin" />
  </div>

  <button type="submit" [disabled]="usuarioForm.invalid">Cadastrar</button>
</form>
